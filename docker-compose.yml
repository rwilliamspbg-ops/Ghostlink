version: '3.8'

services:
  # ─── Native LLM Inference (llama.cpp server) ───
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: ghostlink-llama-server
    ports:
      - "8080:8080"
    environment:
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080
      # Use conservative default of 20 GPU layers to prevent OOM (can be overridden)
      LLAMA_ARG_NGL: ${LLAMA_ARG_NGL:-20}
      LLAMA_ARG_MODEL: /models/model.gguf
      # Local inference throughput: Flash Attention + larger prompt batches
      LLAMA_ARG_FLASH_ATTN: ${LLAMA_ARG_FLASH_ATTN:-on}
      LLAMA_ARG_BATCH: ${LLAMA_ARG_BATCH:-2048}
      LLAMA_ARG_UBATCH: ${LLAMA_ARG_UBATCH:-512}
    volumes:
      - ./models/stories15M-q4_0.gguf:/models/model.gguf:ro
    networks:
      - ghostlink-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # ─── Ghostlink API Server ───
  ghostlink-api:
    build:
      context: .
      dockerfile: Dockerfile.ghostlink
    container_name: ghostlink-api
    ports:
      - "8003:8003"
    environment:
      RUST_LOG: info
      GHOSTLINK_HOST: 0.0.0.0
      GHOSTLINK_PORT: 8003
      GHOSTLINK_INFERENCE_BACKEND: native
      GHOSTLINK_NATIVE_ENGINE: llama_server
      GHOSTLINK_LLAMA_SERVER_URL: http://llama-server:8080/completion
      # Shared with control-plane below via the ghostlink-api-key volume, so
      # control-plane's own auth.LoadAPIKey() can find the same key instead
      # of silently coming up empty (each service is its own container with
      # its own filesystem, so the default relative "api_key.txt" path never
      # lines up between them on its own).
      GHOSTLINK_API_KEY_PATH: /shared/api_key.txt
    volumes:
      - ghostlink-api-key:/shared
    networks:
      - ghostlink-network
    depends_on:
      llama-server:
        condition: service_healthy
    command: serve 0.0.0.0 8003
    healthcheck:
      # -k: binding 0.0.0.0 forces ghost-link's TLS-on-non-loopback rule
      # (crates/ghost-link/src/tls.rs's is_loopback_host / main.rs's
      # use_tls), so this serves a self-signed HTTPS cert, not plain HTTP —
      # same reasoning as docker-compose.rpc-fabric.yml's healthcheck.
      test: ["CMD", "curl", "-fk", "https://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ─── Ghostlink Control Plane (Go gateway: streaming-safe proxy, CORS,
  #     request logging, rate limiting — worker/model/session state all
  #     stays owned by ghostlink-api, this just fronts it) ───
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.control-plane
    container_name: ghostlink-control-plane
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      # https:// (not http://): ghostlink-api binds 0.0.0.0, which forces
      # its self-signed-TLS listener on (see the matching comment on its
      # healthcheck above) — proxy.go's NewChatProxy already skips cert
      # verification for an https:// backend URL specifically to handle
      # this, so plain http:// here would make every proxied request fail,
      # not just the healthcheck.
      GHOSTLINK_BACKEND_URL: https://ghostlink-api:8003
      # See the matching comment on ghostlink-api's GHOSTLINK_API_KEY_PATH
      # above — without this, control-plane's edge auth check silently
      # no-ops (empty key = skip), which also means requests that should
      # be rejected for free by that check fall through and consume
      # rate-limit budget instead, so ordinary traffic can trip the
      # limiter far sooner than intended.
      GHOSTLINK_API_KEY_PATH: /shared/api_key.txt
    volumes:
      - ghostlink-api-key:/shared
    networks:
      - ghostlink-network
    depends_on:
      ghostlink-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ─── Ghostlink GUI (React + Vite) ───
  ghostlink-gui:
    build:
      context: ./ghostlink_gui_modern
      dockerfile: Dockerfile
    container_name: ghostlink-gui
    ports:
      - "5173:5173"
    environment:
      # The gateway, not ghostlink-api directly — see config.ts's
      # resolveApiBase. control-plane proxies everything through.
      GHOSTLINK_API_BASE: http://ghostlink-control-plane:8000
    networks:
      - ghostlink-network
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

  # ─── Monitoring (opt-in: `docker compose up --profile monitoring`) ───
  # Prometheus scrapes ghostlink-api's existing /metrics; Grafana comes up
  # pre-wired to it (datasource + dashboard auto-provisioned from
  # deploy/grafana/provisioning) — no manual setup click needed. Neither
  # service starts on a plain `docker compose up`.
  prometheus:
    image: prom/prometheus:latest
    container_name: ghostlink-prometheus
    profiles: ["monitoring"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Read-only access to the same API key ghostlink-api/control-plane
      # already share (see ghostlink-api's GHOSTLINK_API_KEY_PATH comment
      # above) — /metrics needs a bearer token like every other route
      # except /health, and prometheus.yml's authorization.credentials_file
      # reads it from here.
      - ghostlink-api-key:/shared:ro
    ports:
      - "9090:9090"
    networks:
      - ghostlink-network
    depends_on:
      ghostlink-api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ghostlink-grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:5173"
    networks:
      - ghostlink-network
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  ghostlink-network:
    driver: bridge

volumes:
  ghostlink-api-key: