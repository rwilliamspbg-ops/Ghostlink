[[mcp_servers]]
name = "filesystem"
slot = "file_operations"
enabled = true
transport = "stdio"
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-filesystem",
    "./mcp_workspace",
]
requires_confirmation = false
timeout_secs = 30

[mcp_servers.env]

