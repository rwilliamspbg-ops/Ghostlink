# --- Capability classes ---
#
# Every MCP tool the chat loop can reach is classified read / write / exec in
# Rust (`crates/ghost-link/src/capability.rs`), keyed on (server name, tool
# name), and enforced before dispatch. `requires_confirmation` below is
# PER-SERVER and only decides whether the legacy blocking confirmation pause
# fires — it is not the security boundary, and it cannot distinguish
# `read_text_file` from `write_file` on the same server.
#
# The classification table fails CLOSED: a tool not listed there is treated as
# `exec`, including an unlisted tool on a server that is listed. So adding a new
# server or tool here does not silently grant it read access — it gets gated
# until someone vets it. Check the effective classification of everything
# currently connected with:
#
#   curl -H "Authorization: Bearer $GHOSTLINK_API_KEY" \
#        http://127.0.0.1:8003/api/inference/capabilities
#
# Known classes (see the table for the authoritative list):
#   read  - filesystem inspection, calculator, rag search, memory catalog/search,
#           git log/diff/status/blame, web fetch/search, sequential-thinking,
#           vision
#   write - filesystem write/edit/mkdir/move, rag index_document, memory
#           remember/forget, git commit/add/checkout/reset/push, sqlite writes
#   exec  - terminal, code execution, docker gateway, and ANY UNLISTED TOOL

[[mcp_servers]]
name = "filesystem"
slot = "file_operations"
enabled = true
transport = "stdio"
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-filesystem",
    "./mcp_workspace",
]
requires_confirmation = false
timeout_secs = 30

[mcp_servers.env]

[[mcp_servers]]
name = "fetch"
slot = "api_call"
enabled = true
transport = "stdio"
command = "uvx"
# mcp-server-fetch has no upper bound on its `mcp` dependency, so a bare
# `uvx mcp-server-fetch` can resolve a newer `mcp` SDK than the package was
# built against and fail to import. Pin a known-compatible version with `==`,
# not `<`/`>` — this command runs via `cmd /C` on Windows (see client.rs
# build_command) and cmd.exe reads a bare `<` as stdin redirection.
args = ["--python", "3.12", "--with", "mcp==1.13.0",
    "--with",
    "pydantic==2.11.7", "--with", "pywin32", "mcp-server-fetch"]
requires_confirmation = false
timeout_secs = 30

[mcp_servers.env]

[[mcp_servers]]
name = "calculator"
slot = "calculator"
enabled = true
transport = "stdio"
command = "target/release/mcp-calculator.exe"
args = []
requires_confirmation = false
timeout_secs = 30

[mcp_servers.env]

[[mcp_servers]]
name = "sqlite"
slot = "database_query"
enabled = true
transport = "stdio"
# mcp==1.9.4 is required: unpinned, mcp-server-sqlite resolves against a newer
# `mcp` whose decorator API dropped `Server.list_resources`, and it dies at import.
# pywin32 is required on Windows: `mcp.os.win32.utilities` imports `pywintypes`,
# which is not present in uvx's ephemeral environment by default.
command = "uvx"
args = [
    "--python",
    "3.12",
    "--with",
    "mcp==1.13.0",
    "--with",
    "pydantic==2.11.7",
    "--with",
    "pywin32",
    "mcp-server-sqlite",
    "--db-path",
    "./mcp_workspace/ghostlink.db",
]
requires_confirmation = false
timeout_secs = 30

[mcp_servers.env]

[[mcp_servers]]
name = "duckduckgo"
# Local-first web search, no API key. Replaces brave-search, which needed
# BRAVE_API_KEY and a paid account -- against this project's "all local, no
# cloud dependency" constraint.
#
# Caveat worth knowing: DuckDuckGo's free HTML endpoint rate-limits aggressively
# and returns "DDG detected an anomaly in the request" under load. It works for
# occasional lookups; it is not a high-throughput search backend. The capability
# class is still Read, so a rate-limited response is an observation, not an
# action needing approval.
slot = "web_search"
enabled = false
transport = "stdio"
command = "npx"
args = ["-y", "duckduckgo-mcp-server"]
requires_confirmation = false
timeout_secs = 60

[mcp_servers.env]


[[mcp_servers]]
name = "docker-code-execution"
slot = "code_execution"
enabled = false
transport = "stdio"
command = "docker"
args = [
    "mcp",
    "gateway",
    "run",
]
requires_confirmation = true
timeout_secs = 30

[mcp_servers.env]

[[mcp_servers]]
name = "docker-terminal"
slot = "terminal"
enabled = false
transport = "stdio"
command = "docker"
args = [
    "mcp",
    "gateway",
    "run",
]
requires_confirmation = true
timeout_secs = 30

[mcp_servers.env]

# --- Standalone additions (no legacy tool slot; addressed by server name) ---

[[mcp_servers]]
name = "sequential-thinking"
# A real slot (not "") keeps this behind a Tools-panel checkbox instead of
# always-on — models kept calling it unprompted on trivial messages, adding
# a slow, pointless round-trip. Same pattern as git_tools/docker_gateway.
slot = "sequential_thinking"
enabled = true
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]
requires_confirmation = false
timeout_secs = 30

[mcp_servers.env]

[[mcp_servers]]
name = "vision"
# A real slot (not "") keeps this behind a Tools-panel checkbox instead of
# always-on, same as git_tools/sequential_thinking above.
slot = "vision"
# Wraps Ghostlink's own local Ollama connection to call a vision-capable model
# (llava, moondream, bakllava, ...) instead of adding a cloud dependency.
# Disabled by default: enable once you've `ollama pull`ed a vision model.
enabled = false
transport = "stdio"
command = "target/release/mcp-vision.exe"
args = []
requires_confirmation = false
timeout_secs = 30

[mcp_servers.env]
OLLAMA_URL = "http://127.0.0.1:11434"
OLLAMA_VISION_MODEL = "llava"

[[mcp_servers]]
name = "rag"
slot = "rag"
enabled = false
transport = "stdio"
command = "target/release/mcp-rag.exe"
args = []
timeout_secs = 120

[mcp_servers.env]
# Embedding backend: `llama` removes the Ollama dependency entirely.
#
# Requires a SECOND llama-server, separate from the chat model on :8080 -- an
# embedding model and a chat model cannot share one instance:
#
#   llama-server -m models/nomic-embed-text-v1.5.Q4_K_M.gguf \
#     --embedding --pooling mean --host 127.0.0.1 --port 8081
#
# `auto` (the default) tries llama first and falls back to Ollama. Set `ollama`
# to pin the legacy path. Embedding vectors are only comparable within a model,
# so changing backend means re-indexing -- see GHOSTLINK_RAG_INDEX_PATH.
GHOSTLINK_EMBED_BACKEND = "llama"
EMBEDDING_URL = "http://127.0.0.1:8081"
GHOSTLINK_RAG_INDEX_PATH = "rag_index.json"
# Only consulted by the `ollama` / `auto` fallback.
OLLAMA_URL = "http://127.0.0.1:11434"
OLLAMA_EMBED_MODEL = "nomic-embed-text"


[[mcp_servers]]
name = "docker-mcp-gateway"
# Aggregates Docker MCP Toolkit's whole catalog behind one connection. A real
# slot (not "") keeps its 8 tools out of standalone_tool_schemas() and behind
# a Tools-panel checkbox instead — same pattern as docker-code-execution/
# docker-terminal above. Disabled by default: requires Docker Desktop running.
slot = "docker_gateway"
enabled = false
transport = "stdio"
command = "docker"
args = ["mcp", "gateway", "run"]
requires_confirmation = true
timeout_secs = 30

[mcp_servers.env]

[[mcp_servers]]
name = "git"
# Read/inspect git history, diffs, status, and blame for the repo Ghostlink is
# running in — pairs with `filesystem` to make chat a real coding agent.
# Requires `uvx` (bundled with `uv`); no API key. Same `mcp` version pin as
# `fetch` above — mcp-server-git breaks against the newest `mcp` SDK too.
# A real slot (not "") keeps its 12 tools out of standalone_tool_schemas()
# and behind a Tools-panel checkbox, same as docker-mcp-gateway above.
slot = "git_tools"
enabled = true
transport = "stdio"
command = "uvx"
args = [
    "--python",
    "3.12",
    "--with",
    "mcp==1.13.0",
    "--with",
    "pydantic==2.11.7",
    "--with",
    "pywin32",
    "mcp-server-git",
    "--repository",
    ".",
]
requires_confirmation = false
timeout_secs = 30

[mcp_servers.env]

[[mcp_servers]]
name = "memory"
# The assistant's durable memory (crates/mcp-memory): SQLite-backed, scoped per
# workspace. memory_catalog / memory_search are reads and run as observations;
# memory_remember / memory_forget are writes and are gated behind approval by
# crates/ghost-link/src/capability.rs.
#
# A real slot keeps these four tools behind a Tools-panel checkbox rather than
# always-on -- same pattern as rag/git_tools above.
slot = "memory"
enabled = true
transport = "stdio"
command = "target/release/mcp-memory.exe"
args = []
requires_confirmation = false

[mcp_servers.env]
# One store per workspace would need the id at spawn time; the server takes it
# as a tool argument instead (stamped server-side by ghost-link), so a single
# DB file holds every workspace's rows, partitioned by workspace_id.
GHOSTLINK_MEMORY_DB_PATH = "ghostlink_memory.db"
