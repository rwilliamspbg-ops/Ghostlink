[package]
name = "ghostlink-gui-tauri"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Ghostlink Studio desktop shell"
# Superseded by ghostlink_gui_modern/ (React/Vite) — see this crate's README.
# Not part of the release pipeline; do not publish to crates.io.
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[workspace]
