[package]
name = "ghost-link"
version = "2.0.0"
edition = "2021"
authors = ["Ryan K Williams"]
description = "CLI and API runtime for Ghostlink, a distributed inference fabric for routing and scheduling custom LLM workloads across heterogeneous hardware."
homepage = "https://rwilliamspbg-ops.github.io/Ghostlink/"
documentation = "https://rwilliamspbg-ops.github.io/Ghostlink/"
repository = "https://github.com/rwilliamspbg-ops/Ghostlink"
readme = "README.md"
license = "MIT"
keywords = ["networking", "zero-copy", "async", "distributed", "llm"]
categories = ["asynchronous", "network-programming", "command-line-utilities"]

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85.0"

[features]
default = []
cuda = []
rocm = ["ghostlink-core/rocm"]

[dependencies]
ghostlink-core = { path = "../ghostlink-core", version = "2.0.0" }

# Local date/time for the assistant system prompt
chrono = "0.4"

# Production error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# API Server
axum = { version = "0.7", features = ["macros"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tower_governor = { version = "0.4.3", features = ["axum"] }

# Object-safe async trait for the custom inference backend plugin system
async-trait = "0.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }

# UUID for chat completions
uuid = { version = "1", features = ["v4"] }

# Host CPU / memory sampling for /api/metrics
sysinfo = "0.33"

# MCP (Model Context Protocol) client — spawns/connects to tool servers
rmcp = { version = "2", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
# HeaderName/HeaderValue for the HTTP MCP transport's custom headers
http = "1"
# rmcp's HTTP/SSE MCP transport needs reqwest 0.13 specifically (this crate's `reqwest`
# dependency above is pinned to 0.12 for everything else); aliased so both coexist.
mcp-reqwest = { package = "reqwest", version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "rustls",
] }
rustls = { version = "0.23.42", features = ["prefer-post-quantum"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
rcgen = "0.14.7"

# API key hashing for the RBAC key store (already a workspace dependency via ghostlink-core)
sha2 = "0.10"
# HMAC-SHA256 for the RPC peer auth handshake (rpc_cluster::admit_via_secret)
hmac = "0.12"
# Optional OpenTelemetry tracing export (otel.rs) — the blocking reqwest
# client (not the async one) is deliberate: spans are exported via the SDK's
# synchronous SimpleSpanProcessor, called from main() before any tokio
# runtime exists (main() dispatches several non-serve subcommands too), so
# the underlying HTTP client must not depend on an ambient async reactor.
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.1"
tracing-opentelemetry = "0.33.0"
opentelemetry-otlp = { version = "0.32.0", features = ["http-proto", "reqwest-blocking-client"] }
