version: '3.8'

services:
  ghostlink-backend:
    image: ghostlink:latest
    container_name: ghostlink-backend
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/tmp
    ports:
      - "8003:8003"
    environment:
      GHOSTLINK_DATA_DIR: "/tmp/data"
      GHOSTLINK_JWT_SECRET_PATH: "/tmp/jwt_secret.txt"
      - LOG_LEVEL=info
      - WORKERS=4
    volumes:
      - ghostlink-models:/home/ghostlink/.cache/models
      - ghostlink-data:/home/ghostlink/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ghostlink
    restart: unless-stopped

  ghostlink-gui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghostlink-gui
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/tmp
    ports:
      - "5173:5173"
    environment:
      GHOSTLINK_DATA_DIR: "/tmp/data"
      GHOSTLINK_JWT_SECRET_PATH: "/tmp/jwt_secret.txt"
      - GHOSTLINK_API_BASE=http://127.0.0.1:8003
    depends_on:
      ghostlink-backend:
        condition: service_healthy
    networks:
      - ghostlink
    restart: unless-stopped

volumes:
  ghostlink-models:
    driver: local
  ghostlink-data:
    driver: local

networks:
  ghostlink:
    driver: bridge
