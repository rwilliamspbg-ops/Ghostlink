name: Release Artifacts

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ghostlink_gui_modern/package-lock.json

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd ghostlink_gui_modern
          npm ci

      - name: Validate release tag format
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$ ]]

      - name: Run release validation gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cd control-plane && go test ./...
          cd ../ghostlink_gui_modern && npm run test && npm run build

      - name: Require signing key configuration
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "${GPG_PRIVATE_KEY}"
          test -n "${GPG_PASSPHRASE}"

      - name: Import GPG key
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent

      - name: Build release bundle
        env:
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            bash scripts/release_bundle.sh ./artifacts/release signed
          else
            bash scripts/release_bundle.sh ./artifacts/release unsigned
          fi

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          file: ./artifacts/release/ghost-link
          format: spdx-json
          output-file: ./artifacts/release/sbom.spdx.json

      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ./artifacts/release/ghost-link

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghost-link-release
          path: artifacts/release/
          retention-days: 30
