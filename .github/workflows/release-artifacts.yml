name: Release Artifacts

# NOTE: `workflow_dispatch` must be run against the release TAG, not a branch.
# A manual dispatch defaults to `main`, where `github.ref` is
# `refs/heads/main` — the tag-gated steps below (version verification, signing,
# release notes, and "Publish GitHub Release") then silently SKIP while the job
# still reports success, producing a release with zero assets. The
# "Require a tag ref" step now fails loudly instead.
'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release-artifacts:
    name: Build Release Artifacts (${{ matrix.os }}${{ matrix.target != '' && format(' [{0}]', matrix.target) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: ''
            artifact_suffix: ubuntu-latest
          - os: windows-latest
            target: ''
            artifact_suffix: windows-latest
          - os: macos-latest
            target: ''
            artifact_suffix: macos-latest
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_suffix: ubuntu-latest-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_suffix: macos-latest-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Require a tag ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "::error::This workflow builds and publishes a release and must run against a tag, not '${GITHUB_REF}'."
            echo "::error::Re-run it from the Actions tab, choose this workflow, click 'Run workflow', and select the TAG (not the branch) — or dispatch the API with {\"ref\": \"vX.Y.Z\"}."
            echo "::error::Running against a branch skips the version check, signing, release notes, and the GitHub Release publish itself."
            exit 1
          fi
          echo "Running against release tag ${GITHUB_REF_NAME}."
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ghostlink_gui_modern/package-lock.json

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd ghostlink_gui_modern
          npm ci

      - name: Install cross-compilation tools (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      - name: Validate release tag format
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$ ]]

      - name: Verify artifact versions match release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          core_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/ghostlink-core/Cargo.toml | head -1)"
          cli_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/ghost-link/Cargo.toml | head -1)"
          gui_version="$(node -p "require('./ghostlink_gui_modern/package.json').version")"
          [[ "$core_version" == "$version" ]]
          [[ "$cli_version" == "$version" ]]
          [[ "$gui_version" == "$version" ]]

      - name: Run release validation gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cd control-plane && go test ./...
          cd ../ghostlink_gui_modern && npm run test && npm run build

      - name: Detect signing key availability
        id: gpg-check
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -n "${GPG_PRIVATE_KEY}" && -n "${GPG_PASSPHRASE}" ]]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_GPG_PRIVATE_KEY or RELEASE_GPG_PASSPHRASE is not set; release bundle will be unsigned."
          fi

      - name: Import GPG key
        if: startsWith(github.ref, 'refs/tags/') && steps.gpg-check.outputs.has_key == 'true'
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent

      - name: Build release bundle
        shell: bash
        env:
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          CARGO_TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'arm64' || matrix.target == 'aarch64-apple-darwin' && 'arm64' || '' }}
        run: |
          set -euo pipefail
          if [[ "${CARGO_TARGET}" == "aarch64-unknown-linux-gnu" ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]] && [[ "${{ steps.gpg-check.outputs.has_key }}" == "true" ]]; then
            bash scripts/release_bundle.sh ./artifacts/release signed "${{ matrix.artifact_suffix }}" "${{ matrix.target }}"
          else
            bash scripts/release_bundle.sh ./artifacts/release unsigned "${{ matrix.artifact_suffix }}" "${{ matrix.target }}"
          fi

      - name: Generate SBOM
        if: matrix.os == 'ubuntu-latest' && matrix.target == ''
        uses: anchore/sbom-action@v0
        with:
          file: ./artifacts/release/ghost-link-${{ matrix.artifact_suffix }}
          format: spdx-json
          output-file: ./artifacts/release/sbom.spdx.json

      - name: Attest release artifact provenance
        if: matrix.os == 'ubuntu-latest' && matrix.target == ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ./artifacts/release/ghost-link-${{ matrix.artifact_suffix }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghost-link-release-${{ matrix.artifact_suffix }}
          path: artifacts/release/
          retention-days: 30

      - name: Extract CHANGELOG section for this version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found = 1; print; next }
              next
            }
            found { print }
          ' CHANGELOG.md > ./artifacts/release/release-notes.md
          if [[ ! -s ./artifacts/release/release-notes.md ]]; then
            echo "No matching CHANGELOG.md section found for ${GITHUB_REF_NAME}; see CHANGELOG.md for details." \
              > ./artifacts/release/release-notes.md
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Ghostlink ${{ github.ref_name }}
          body_path: ./artifacts/release/release-notes.md
          files: |
            ./artifacts/release/ghost-link-${{ matrix.artifact_suffix }}*
            ./artifacts/release/SHA256SUMS-${{ matrix.artifact_suffix }}*
            ./artifacts/release/sbom.spdx.json
          fail_on_unmatched_files: false
