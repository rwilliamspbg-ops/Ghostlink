name: Docs

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - docs/runtime-probe-docs
      - 'release/**'
      - 'hotfix/**'
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/verify_hf_models.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/verify_hf_models.py'
      - '.github/workflows/docs.yml'

jobs:
  docs-consistency:
    name: Docs Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify required docs exist
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f TESTING.md
          test -f docs/ARCHITECTURE.md
          test -f docs/BENCHMARKS.md
          test -f docs/DEPLOYMENT.md
          test -f docs/EXAMPLES.md
          test -f docs/QUICKSTART.md
          test -f docs/SECURITY_MODEL.md
          test -f docs/TROUBLESHOOTING.md
          # Perf gate artifacts consumed by production-gate.yml from docs/
          test -f docs/FLOW_PERF_TUNING.json
          test -f docs/PERF_BASELINE.json
          test -f docs/PERF_BASELINE_STRESS.json
          test -f docs/archive/INDEX.md
          test -f docs/archive/VERIFICATION.md

      - name: Verify TESTING.md references key checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q "cargo test --workspace" TESTING.md
          grep -q "cargo clippy --workspace --all-targets -- -D warnings" TESTING.md
          grep -q "scripts/verify_hf_models.py" TESTING.md
