name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (cargo) - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - run: cargo build --release -p ghost-link -p ghostlink-core
      - run: cargo test --release -p ghost-link -p ghostlink-core
      - run: cargo clippy --all-targets -- -D warnings

  rust-aarch64:
    name: Rust (aarch64) - ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - name: Build ghost-link for ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: cargo build --release --target ${{ matrix.target }} -p ghost-link
      - name: Upload aarch64 binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-link-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/ghost-link

  go:
    name: Go (control-plane)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go build ./...
      - run: go test ./...

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghostlink_gui_modern
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ghostlink_gui_modern/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run type-check
      - run: npm test

  version-consistency:
    name: Manifest Version Consistency & Publish Dry-Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - name: Verify Version Lockstep Across Manifests
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/ghost-link/Cargo.toml | head -1)"
          core_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/ghostlink-core/Cargo.toml | head -1)"
          gui_version="$(node -p "require('./ghostlink_gui_modern/package.json').version")"
          js_sdk_version="$(node -p "require('./sdks/js/package.json').version")"
          py_sdk_version="$(python3 -c '
import tomllib
with open("sdks/python/pyproject.toml", "rb") as f:
    print(tomllib.load(f)["project"]["version"])
')"

          echo "ghost-link version: ${version}"
          echo "core_version: ${core_version}"
          echo "gui_version: ${gui_version}"
          echo "js_sdk_version: ${js_sdk_version}"
          echo "py_sdk_version: ${py_sdk_version}"

          if [[ "${core_version}" != "${version}" ]] || \
             [[ "${gui_version}" != "${version}" ]] || \
             [[ "${js_sdk_version}" != "${version}" ]] || \
             [[ "${py_sdk_version}" != "${version}" ]]; then
            echo "::error::Version mismatch across manifests! ghost-link=${version}, core=${core_version}, gui=${gui_version}, js_sdk=${js_sdk_version}, py_sdk=${py_sdk_version}"
            exit 1
          fi

          if ! grep -qF "## [${version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing header '## [${version}]'"
            exit 1
          fi

      - name: Dry-run publish ghostlink-core
        run: cargo publish -p ghostlink-core --dry-run

      - name: Dry-run publish ghost-link
        run: cargo publish -p ghost-link --dry-run --allow-dirty || true
