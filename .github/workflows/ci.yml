name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify no unresolved stub TODO markers
        run: ./scripts/verify_no_stub_todos.sh
      
      - name: Check code
        run: cargo check --workspace
      
      - name: Run tests
        run: cargo test --workspace --lib
      
      - name: Build release
        run: cargo build --release --workspace
      
  msrv:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@1.89.0
      
      - name: Verify MSRV
        run: cargo check --workspace
