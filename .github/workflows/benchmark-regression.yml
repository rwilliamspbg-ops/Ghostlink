name: Benchmark Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/ghostlink-core/**'
      - 'crates/ghost-link/src/runtime.rs'
      - 'crates/ghost-link/src/transport.rs'
      - 'docs/PERF_BASELINE.json'

permissions:
  contents: read

jobs:
  bench:
    name: Benchmark Comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - name: Install critcmp
        run: cargo install critcmp --locked
      - name: Run benchmarks (PR)
        run: cargo bench --package ghostlink-core -- --save-baseline pr
      - name: Checkout main
        run: |
          git fetch origin main
          git checkout origin/main
      - name: Run benchmarks (main)
        run: cargo bench --package ghostlink-core -- --save-baseline main
      - name: Compare benchmarks
        run: critcmp main pr --threshold 10
