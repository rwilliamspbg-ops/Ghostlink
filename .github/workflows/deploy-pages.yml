name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Validate Pages content
        run: |
          test -f docs/index.html
          test -f docs/assets/demo/ghostlink-walkthrough.gif
          echo "Pages content validated"

      - name: Build slim Pages artifact
        run: |
          rm -rf pages-site
          mkdir -p pages-site/assets/demo
          cp docs/index.html pages-site/index.html
          cp docs/assets/demo/ghostlink-walkthrough.gif pages-site/assets/demo/ghostlink-walkthrough.gif
          test -f pages-site/index.html
          test -f pages-site/assets/demo/ghostlink-walkthrough.gif
          echo "Prepared Pages artifact with $(find pages-site -type f | wc -l) files"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Report deployment status
        if: always()
        run: |
          echo "Pages setup status: ${{ steps.setup_pages.outcome }}"
          echo "Deployment status: ${{ steps.deployment.outcome }}"
