name: Tests

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - docs/runtime-probe-docs
      - 'release/**'
      - 'hotfix/**'
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'scripts/**'
      - 'tests/**'
      - 'benches/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'scripts/**'
      - 'tests/**'
      - 'benches/**'
      - '.github/workflows/tests.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: Rust Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify no unresolved stub TODO markers
        run: ./scripts/verify_no_stub_todos.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (Tauri crate)
        working-directory: crates/ghostlink-gui/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  workspace-tests:
    name: Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --verbose
      - run: cargo test --doc

  frontend-build-smoke:
    name: Frontend Build Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: crates/ghostlink-gui/frontend/package-lock.json
      - name: Build frontend
        working-directory: crates/ghostlink-gui/frontend
        run: |
          npm ci
          npm run build

  gui-backend-smoke:
    name: GUI Backend Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run backend API smoke
        run: python3 scripts/ci_gui_backend_smoke.py
      - name: Run backend API contract tests
        run: python3 scripts/test_api_contract.py
