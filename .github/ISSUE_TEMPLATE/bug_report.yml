name: Bug Report
description: Report a bug or unexpected behavior in Ghostlink
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the sections below to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: "What happened? What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `launch.bat`
        2. Open http://127.0.0.1:5173
        3. Click on Models tab
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened, including error messages.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please provide:
        - OS (e.g., Windows 11, Ubuntu 22.04, macOS 14)
        - Rust version (`rustc --version`)
        - Node.js version (`node -v`)
        - GPU (if applicable)
        - Launch method (launch.bat, launch.sh, Docker, manual cargo run)
      value: |
        - OS:
        - Rust:
        - Node.js:
        - GPU:
        - Launch method:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and Error Output
      description: Paste relevant log output or error messages. Use triple backticks for code blocks.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or links that might help.
