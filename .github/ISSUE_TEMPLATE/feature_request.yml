name: Feature Request
description: Suggest a new feature or enhancement for Ghostlink
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature. Please describe your idea and how it would improve Ghostlink.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What limitation are you experiencing?
      placeholder: "I'm frustrated when... / It would be useful to..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the feature or enhancement you'd like to see.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Ghostlink does this relate to?
      options:
        - GUI / Frontend
        - Backend / API
        - Model Management
        - Chat / Inference
        - Distributed Fabric
        - Control Plane
        - Launch Scripts / Deployment
        - Documentation
        - Testing / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches you've considered.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, diagrams, links to related work, or any other context.
