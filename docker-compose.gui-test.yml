version: "3.8"

services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: ghostlink-llama-server
    ports:
      - "8080:8080"
    environment:
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_NGL=0
      - LLAMA_ARG_MODEL=/models/model.gguf
    volumes:
      - ${GHOSTLINK_MODEL_PATH:-/tmp/ghostlink-models/stories15M-q4_0.gguf}:/models/model.gguf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ghostlink-backend:
    build:
      context: .
      dockerfile: Dockerfile.gui-test
    container_name: ghostlink-backend
    ports:
      - "8003:8003"
    environment:
      - GHOSTLINK_BACKEND_HOST=0.0.0.0
      - GHOSTLINK_BACKEND_PORT=8003
      - GHOSTLINK_INFERENCE_BACKEND=native
      - GHOSTLINK_NATIVE_ENGINE=llama_server
      - GHOSTLINK_LLAMA_SERVER_URL=http://llama-server:8080/completion
    depends_on:
      llama-server:
        condition: service_healthy
    volumes:
      - .:/app
    command: python3 scripts/backend_test_server.py
